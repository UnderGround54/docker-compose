services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: stock_api
      MYSQL_USER: ${DB_USER:-stock_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-stock_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local_root_password}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3308}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../clean_architecture
      target: runtime
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_SECRET: ${APP_SECRET:-local_only_change_me}
      DATABASE_URL: mysql://${DB_USER:-stock_user}:${DB_PASSWORD:-stock_password}@db:3306/stock_api?serverVersion=8.0.32&charset=utf8mb4
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$$'
    command:
      - sh
      - -c
      - php bin/console doctrine:migrations:migrate --no-interaction && exec php-fpm
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  api-web:
    build:
      context: ../clean_architecture
      target: web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  front:
    build:
      context: ../gestion-stock-front-CA
    ports:
      - "${FRONT_PORT:-4201}:80"
    depends_on:
      - api-web

  adminer:
    image: adminer
    profiles: ["tools"]
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  db_data: